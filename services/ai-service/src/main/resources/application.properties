quarkus.http.port=8084

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cosmic_blanket
quarkus.datasource.username=cosmic
quarkus.datasource.password=cosmic
quarkus.hibernate-orm.database.default-schema=ai
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=ai
quarkus.flyway.locations=classpath:db/migration

# Kafka
mp.messaging.incoming.documents-changed.connector=smallrye-kafka
mp.messaging.incoming.documents-changed.topic=documents.changed
mp.messaging.incoming.documents-changed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.documents-changed.group.id=ai-service
mp.messaging.incoming.documents-changed.auto.offset.reset=earliest
mp.messaging.incoming.documents-changed.failure-strategy=ignore

# LLM configuration
cosmic.ai.llm.provider=claude
cosmic.ai.llm.api-key=${ANTHROPIC_API_KEY:placeholder}
cosmic.ai.llm.model=claude-sonnet-4-20250514

# Vector store (Milvus)
cosmic.ai.vector.host=localhost
cosmic.ai.vector.port=19530
cosmic.ai.vector.collection=state_documents

# Embedding
cosmic.ai.embedding.dimensions=1024

quarkus.smallrye-openapi.info-title=AI Service API
quarkus.smallrye-openapi.info-version=1.0.0
