quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location

# REST Client configuration for downstream services
quarkus.rest-client.licensing-service.url=http://localhost:8081
quarkus.rest-client.vital-records-service.url=http://localhost:8082
quarkus.rest-client.property-tax-service.url=http://localhost:8083
quarkus.rest-client.ai-service.url=http://localhost:8084

quarkus.smallrye-openapi.info-title=Cosmic Blanket Gateway API
quarkus.smallrye-openapi.info-version=1.0.0

# OIDC / Keycloak
quarkus.oidc.auth-server-url=http://localhost:8180/realms/nova
quarkus.oidc.client-id=cosmic-gateway
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=cosmic-gateway

# Keycloak Dev Services
quarkus.keycloak.devservices.realm-path=nova-realm.json

# Auth policies - GET endpoints are public, write operations require authentication
quarkus.http.auth.permission.public.paths=/api/*/status,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.publicget.paths=/api/*
quarkus.http.auth.permission.publicget.policy=permit
quarkus.http.auth.permission.publicget.methods=GET
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.authenticated.methods=POST,PUT,PATCH,DELETE
