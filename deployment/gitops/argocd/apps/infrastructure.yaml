apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cosmic-blanket-infrastructure
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cosmic-blanket
  source:
    repoURL: https://github.com/Jnowakoski15/cosmic-blanket.git
    targetRevision: feature/cosmic-blanket-scaffold
    path: deployment/gitops/infrastructure/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cosmic-blanket
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
