apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cosmic-blanket
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cosmic-blanket
  source:
    repoURL: https://github.com/Jnowakoski15/cosmic-blanket.git
    targetRevision: feature/cosmic-blanket-scaffold
    path: deployment/gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
