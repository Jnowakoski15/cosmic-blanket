apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  source:
    type: Git
    git:
      uri: https://github.com/Jnowakoski15/cosmic-blanket.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: deployment/containers/Containerfile.service
      buildArgs:
        - name: SERVICE_NAME
          value: gateway
        - name: SERVICE_PORT
          value: "8080"
  output:
    to:
      kind: ImageStreamTag
      name: gateway:latest
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 3Gi
      cpu: "2"
---
