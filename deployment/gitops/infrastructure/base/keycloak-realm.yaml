apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  nova-realm.json: |
    {
      "realm": "nova",
      "enabled": true,
      "registrationAllowed": true,
      "roles": {
        "realm": [
          { "name": "citizen", "description": "State citizen" },
          { "name": "employee", "description": "State government employee" },
          { "name": "admin", "description": "System administrator" }
        ]
      },
      "clients": [
        {
          "clientId": "cosmic-gateway",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "defaultClientScopes": ["openid", "profile", "email", "roles"]
        },
        {
          "clientId": "cosmic-frontend",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "defaultClientScopes": ["openid", "profile", "email", "roles"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        }
      ],
      "users": [
        {
          "username": "citizen1",
          "enabled": true,
          "email": "citizen1@nova.gov",
          "firstName": "Jane",
          "lastName": "Doe",
          "credentials": [{ "type": "password", "value": "password", "temporary": false }],
          "realmRoles": ["citizen"]
        },
        {
          "username": "employee1",
          "enabled": true,
          "email": "employee1@nova.gov",
          "firstName": "John",
          "lastName": "Smith",
          "credentials": [{ "type": "password", "value": "password", "temporary": false }],
          "realmRoles": ["employee"]
        },
        {
          "username": "admin1",
          "enabled": true,
          "email": "admin1@nova.gov",
          "firstName": "Admin",
          "lastName": "User",
          "credentials": [{ "type": "password", "value": "password", "temporary": false }],
          "realmRoles": ["admin"]
        }
      ]
    }
