apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: cosmic-blanket
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"gateway:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"gateway\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: " "
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_REST_CLIENT_LICENSING_SERVICE_URL
              value: http://licensing-service:8080
            - name: QUARKUS_REST_CLIENT_VITAL_RECORDS_SERVICE_URL
              value: http://vital-records-service:8080
            - name: QUARKUS_REST_CLIENT_PROPERTY_TAX_SERVICE_URL
              value: http://property-tax-service:8080
            - name: QUARKUS_REST_CLIENT_AI_SERVICE_URL
              value: http://ai-service:8080
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/nova
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: any
            - name: QUARKUS_OIDC_TLS_VERIFICATION
              value: none
            - name: QUARKUS_HTTP_AUTH_PERMISSION_PUBLICGET_PATHS
              value: /api/*
            - name: QUARKUS_HTTP_AUTH_PERMISSION_PUBLICGET_POLICY
              value: permit
            - name: QUARKUS_HTTP_AUTH_PERMISSION_PUBLICGET_METHODS
              value: GET
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "*"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
