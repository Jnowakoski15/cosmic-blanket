---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ {
                proxy_pass http://gateway:8080/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / {
                try_files $uri $uri/ /index.html;
            }
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
            location /health {
                return 200 '{"status":"UP"}';
                add_header Content-Type application/json;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env-config
data:
  env-config.js: |
    window.__COSMIC_CONFIG__ = {
      KEYCLOAK_URL: "KEYCLOAK_URL_PLACEHOLDER",
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: cosmic-blanket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: " "
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_REST_CLIENT_LICENSING_SERVICE_URL
              value: http://licensing-service:8080
            - name: QUARKUS_REST_CLIENT_VITAL_RECORDS_SERVICE_URL
              value: http://vital-records-service:8080
            - name: QUARKUS_REST_CLIENT_PROPERTY_TAX_SERVICE_URL
              value: http://property-tax-service:8080
            - name: QUARKUS_REST_CLIENT_AI_SERVICE_URL
              value: http://ai-service:8080
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: KEYCLOAK_URL_PLACEHOLDER
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: FRONTEND_URL_PLACEHOLDER
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
